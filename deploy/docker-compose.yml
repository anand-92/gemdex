# Gemdex reference deploy — the full remote-agent stack.
#
# Four services (one still commented out):
#
#   postgres         the memory store (pgvector). No host port at all.
#   gemdex-server    the BYOI /v1 API. Published on 127.0.0.1 ONLY.
#   gemdex-mcp-http  the Streamable HTTP MCP endpoint. The ONLY thing the
#                    public edge fronts.
#   gemdex-web       the manager UI — lands in GEM2-5, stub below.
#
# The security shape, which the whole file exists to enforce: nothing reaches
# Postgres or the BYOI bearer from the internet. Only /mcp is exposed, and the
# edge (Cloudflare Tunnel or Caddy) connects to mcp-http over loopback.
#
#   internet ──TLS──▶ edge ──▶ 127.0.0.1:8766 (mcp-http) ──▶ gemdex-server ──▶ postgres
#                                                             (compose network only)
#
# This is a SEPARATE project name from packages/server/docker-compose.yml
# ("gemdex"), so a BYOI-only stack and this full stack can coexist on one host
# without fighting over container names or volumes. It does mean the two use
# different volumes: see docs/SELF_HOST_DEPLOY.md before migrating an existing
# BYOI-only deployment.
name: gemdex-deploy

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    # Deliberately NO `ports:`. Reachable only from the compose network, so
    # Postgres is unreachable from the host, let alone the internet.
    environment:
      POSTGRES_DB: gemdex
      POSTGRES_USER: gemdex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gemdex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemdex -d gemdex"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  gemdex-server:
    image: gemdex-server:local
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    # 127.0.0.1 is the security boundary, not a preference. The BYOI bearer is
    # a single long-lived secret with full memory access and no per-user
    # identity, so it must never be publicly routable. mcp-http reaches it over
    # the compose network instead (see GEMDEX_SERVER_URL below); this publish
    # exists only for host-side debugging and the desktop app.
    ports:
      - "127.0.0.1:${GEMDEX_SERVER_PORT:-8765}:8765"
    environment:
      GEMDEX_SERVER_HOST: 0.0.0.0
      GEMDEX_SERVER_PORT: 8765
      GEMDEX_SERVER_TOKEN: ${GEMDEX_SERVER_TOKEN:?Set GEMDEX_SERVER_TOKEN in .env}
      GEMDEX_SERVER_DATABASE_URL: postgres://gemdex:${POSTGRES_PASSWORD}@postgres:5432/gemdex

      # The ONLY container with a Gemini key, and it stays that way. It embeds
      # on save/recall, and it is also where uploaded chat sessions are cleaned
      # and digested (POST /v1/sessions/ingest) — this is the one process that
      # has the ingest pipeline, the key, and the store all at once, so the web
      # manager forwards transcripts here instead of holding a key of its own.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMDEX_SERVER_ALLOWED_ORIGINS: ${GEMDEX_SERVER_ALLOWED_ORIGINS:-}
      GEMDEX_SERVER_UNSAFE_DEV_NO_AUTH: "false"
      BLOB_STORE: file
      BLOB_DIR: /var/lib/gemdex/blobs

      # S3-compatible alternative: remove BLOB_STORE/BLOB_DIR above, uncomment
      # these, and provide the referenced variables in .env.
      # BLOB_STORE: s3
      # S3_BUCKET: ${S3_BUCKET}
      # S3_ENDPOINT: ${S3_ENDPOINT}
      # S3_REGION: ${S3_REGION:-auto}
      # S3_PREFIX: ${S3_PREFIX:-}
      # S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      # S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - gemdex-blobs:/var/lib/gemdex/blobs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8765/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  gemdex-mcp-http:
    image: gemdex-mcp-http:local
    build:
      context: ..
      dockerfile: packages/mcp-http/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      gemdex-server:
        condition: service_healthy
    # Also loopback-only on the host. The edge terminates TLS and connects here
    # over 127.0.0.1, so this port is never itself internet-facing. Publishing
    # 0.0.0.0 would expose plaintext HTTP directly, bypassing the edge's TLS and
    # rate limiting.
    ports:
      - "127.0.0.1:${GEMDEX_MCP_HTTP_PORT:-8766}:8766"
    environment:
      GEMDEX_MCP_HTTP_HOST: 0.0.0.0
      GEMDEX_MCP_HTTP_PORT: 8766

      # Service DNS on the compose network — NOT 127.0.0.1, which inside this
      # container would mean the container itself.
      GEMDEX_SERVER_URL: http://gemdex-server:8765
      GEMDEX_SERVER_TOKEN: ${GEMDEX_SERVER_TOKEN:?Set GEMDEX_SERVER_TOKEN in .env}

      # Auth. `google` = OAuth 2.1 resource server, single-user allowlist.
      # `static` = one shared bearer; loopback dev only, do NOT put it behind a
      # public edge. See packages/mcp-http/README.md.
      GEMDEX_MCP_AUTH: ${GEMDEX_MCP_AUTH:-google}

      # Required when GEMDEX_MCP_AUTH=google. GEMDEX_MCP_BASE_URL must be the
      # PUBLIC https URL (it becomes the OAuth issuer and resource identity, and
      # must match the redirect URI registered with Google) — not the loopback
      # address this container binds.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GEMDEX_MCP_BASE_URL: ${GEMDEX_MCP_BASE_URL:-}
      GEMDEX_ALLOWED_EMAIL: ${GEMDEX_ALLOWED_EMAIL:-}

      # Only used when GEMDEX_MCP_AUTH=static.
      GEMDEX_MCP_HTTP_TOKEN: ${GEMDEX_MCP_HTTP_TOKEN:-}

      GEMDEX_TRUST_RANKING: ${GEMDEX_TRUST_RANKING:-false}

      # Where FastMCP keeps OAuthProxy state: dynamic client registrations and
      # the encrypted upstream Google tokens. It defaults to a platformdirs path
      # under $HOME, which is /nonexistent for this system user — with
      # `read_only: true` the process then dies at startup trying to mkdir it.
      # Pointing it at the persistent volume fixes that AND keeps registrations
      # across restarts; on tmpfs every restart would force clients to
      # re-register and re-authorize.
      FASTMCP_HOME: /var/lib/gemdex/fastmcp

      # The report_outcome ledger. Same reason: it defaults to ~/.gemdex, which
      # is unwritable here, and it is real state worth keeping — losing it
      # silently resets every memory's track record.
      GEMDEX_STATS_PATH: /var/lib/gemdex/stats.json
    volumes:
      # Persistent MCP-side state. Two things live here, both of which must
      # survive a recreate: FASTMCP_HOME above, and the report_outcome ledger.
      - gemdex-mcp-state:/var/lib/gemdex
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /healthz, not /mcp: custom routes are auth-exempt in FastMCP, whereas an
      # unauthenticated /mcp call correctly returns 401 and would mark this
      # container unhealthy forever in google mode.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/healthz',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  # --- gemdex-web — the human manager UI (GEM2-5) -------------------------
  #
  # A React SPA plus a FastAPI backend-for-frontend, on its own origin. The two
  # decisions the placeholder left open, and how they were settled:
  #
  #   1. Separate container, not static assets bolted onto mcp-http. The UI needs
  #      a *server-side session* (browsers cannot present bearer tokens) and it
  #      needs DELETE, which the MCP surface deliberately does not have. Those
  #      are different auth models on different paths, so the edge routes by
  #      path: / → gemdex-web, /mcp → gemdex-mcp-http.
  #
  #   2. It does hold the BYOI bearer — and that is the point of a BFF. The
  #      original note said the UI "should go through mcp-http rather than
  #      holding a full-access token", but the browser is not what holds it: the
  #      token lives in this container and never reaches the page. Routing the UI
  #      through mcp-http would mean either adding a delete tool to the agent
  #      surface (breaking "six tools, no delete") or leaving the UI unable to
  #      delete. So the trust boundary is the container, not the transport.
  #
  # This service is stateless: the session is a signed cookie held by the
  # browser, so unlike mcp-http it needs no volume and no writable state dir.
  #
  # Note what it deliberately does NOT get: GEMINI_API_KEY. Its "Upload
  # sessions" page (GEM2-7) hands raw chat transcripts to gemdex-server to clean
  # and digest, because that container already has the ingest pipeline (it is
  # TypeScript; this service is Python and cannot import it), the key, and the
  # store. Adding Node plus a key here would put the credential in a third
  # container to no benefit.
  gemdex-web:
    image: gemdex-web:local
    build:
      context: ..
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      gemdex-server:
        # The BFF talks to the BYOI directly, so that — not mcp-http — is its
        # real dependency. It degrades gracefully (the status page reports the
        # outage), but starting in order avoids a confusing first paint.
        condition: service_healthy
    # Loopback only, like everything else — the edge fronts it.
    ports:
      - "127.0.0.1:${GEMDEX_WEB_PORT:-8767}:8767"
    environment:
      # Service DNS on the compose network, not 127.0.0.1 (which inside this
      # container would be the container itself).
      GEMDEX_SERVER_URL: http://gemdex-server:8765
      GEMDEX_SERVER_TOKEN: ${GEMDEX_SERVER_TOKEN:?Set GEMDEX_SERVER_TOKEN in .env}

      # `google` = Google login restricted to GEMDEX_ALLOWED_EMAIL.
      # `dev` = NO LOGIN AT ALL. Never put dev mode behind a public edge.
      GEMDEX_WEB_AUTH: ${GEMDEX_WEB_AUTH:-google}

      # Required when GEMDEX_WEB_AUTH=google. GEMDEX_WEB_BASE_URL must be the
      # PUBLIC https URL: it builds the OAuth redirect URI, which Google matches
      # by exact string. Reuse the same OAuth client as mcp-http by adding
      # <GEMDEX_WEB_BASE_URL>/auth/google/callback to its authorized redirect
      # URIs — one client can hold several.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GEMDEX_WEB_BASE_URL: ${GEMDEX_WEB_BASE_URL:-}
      GEMDEX_ALLOWED_EMAIL: ${GEMDEX_ALLOWED_EMAIL:-}

      # Signs session cookies. Anyone who can guess it can forge a session and
      # bypass the email allowlist, so it is a real secret: `openssl rand -hex 32`.
      # Changing it signs everyone out.
      GEMDEX_WEB_SESSION_SECRET: ${GEMDEX_WEB_SESSION_SECRET:-}
      GEMDEX_WEB_SESSION_TTL_SECONDS: ${GEMDEX_WEB_SESSION_TTL_SECONDS:-43200}

      # In a container `0.0.0.0` is the namespace's edge, not an exposure — the
      # published port above is loopback-only. dev mode refuses a non-loopback
      # bind unless this is set, so it is required for dev mode *here* and is
      # inert in google mode.
      GEMDEX_WEB_UNSAFE_DEV_BIND: ${GEMDEX_WEB_UNSAFE_DEV_BIND:-false}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /healthz, not /api/*: in google mode every API call is a 401 until a
      # browser signs in, which would mark this container unhealthy forever.
      # `python`, not `wget` — the slim image has no wget.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8767/healthz',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

volumes:
  gemdex-postgres:
  gemdex-blobs:
  gemdex-mcp-state:
