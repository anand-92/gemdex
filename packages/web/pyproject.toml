[project]
name = "gemdex-web"
version = "1.0.37"
description = "Gemdex web manager — OAuth-gated memory CRUD over a FastAPI BFF"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nikhil Anand" }]

# httpx2 (not httpx) to match packages/mcp-http: the MCP SDK v2 line ships
# httpx2, and keeping one HTTP library across both Python services means an
# `except` clause copied between them still matches.
# itsdangerous backs Starlette's SessionMiddleware, which signs the session
# cookie; it is an optional Starlette extra, so declare it explicitly.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx2>=0.28",
    "itsdangerous>=2.2",
]

[project.scripts]
gemdex-web = "gemdex_web.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemdex_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
